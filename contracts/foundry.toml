[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fuzz = { runs = 256 }
invariant = { runs = 256 }

# Test coverage
[profile.ci]
fuzz = { runs = 1000 }
invariant = { runs = 1000 }

# See more config options https://github.com/foundry-rs/foundry/tree/master/config
